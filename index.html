<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>旅の始まり — Happy Birthday Ryan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&family=VT323&display=swap" rel="stylesheet" />
<style>
:root{
  --magenta:#ff2d95;
  --magenta-soft:#ff6fd0;
  --cyan:#37f0ff;
  --cyan-deep:#05d9e8;
  --purple:#b14aed;
  --indigo:#1a0b2e;
  --indigo-deep:#0b0418;
  --sun-1:#ffe86d;
  --sun-2:#ff8a5c;
  --sun-3:#ff5fa8;
  --gold:#f0c463;
  --gold-soft:#ffe0a0;
  --term:#7bf58a;
  --pixel:'Press Start 2P','VT323',monospace;
  --jp:'DotGothic16','Press Start 2P',sans-serif;
  --cjk:'DotGothic16','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:var(--cjk);-webkit-font-smoothing:antialiased;position:relative}
.scene{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease;z-index:1}
.scene.on{opacity:1;visibility:visible;z-index:2}
.scene.top{z-index:3}

/* ============ SCENE 1 — vaporwave intro ============ */
#s1{background:
  radial-gradient(120% 90% at 50% 30%, rgba(255,111,208,.35), transparent 60%),
  linear-gradient(160deg,#3a0f5e 0%, #7b1f8f 28%, #c23c9b 52%, #1fb6c9 78%, #7de0e6 100%);
  overflow:hidden;}
/* tiled photo-panel overlay */
#s1 .panels{position:absolute;inset:-10%;
  background-image:
   linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
   linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:14vw 14vw;transform:rotate(-8deg) scale(1.3);mix-blend-mode:overlay;opacity:.6}
#s1 .sheen{position:absolute;inset:0;background:
  linear-gradient(115deg, transparent 20%, rgba(120,255,240,.18) 38%, rgba(255,120,220,.18) 52%, transparent 70%);
  mix-blend-mode:screen;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,100%{transform:translateX(-6%)}50%{transform:translateX(6%)}}
.bokeh{position:absolute;border-radius:50%;filter:blur(14px);mix-blend-mode:screen;opacity:.75;animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* classical bust, faint, right side */
#s1 .bust{position:absolute;right:-1%;top:5%;height:82%;opacity:.42;filter:blur(1px) drop-shadow(0 0 34px rgba(255,180,230,.5))}
#s1 .palm1{position:absolute;left:-4%;bottom:-2%;height:70%;opacity:.9;filter:drop-shadow(0 0 8px rgba(0,0,0,.4))}
#s1 .titlewrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vw}
#s1 .band{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-4deg);
  width:88%;height:34%;background:linear-gradient(100deg, rgba(90,255,235,.22), rgba(255,110,215,.22));
  border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(2px);border-radius:6px;
  box-shadow:0 0 40px rgba(255,120,220,.35)}
.glitch{position:relative;color:#ffa6e4;font-family:var(--jp);line-height:1.05;
  text-shadow:0 0 18px rgba(255,80,190,.9), 0 0 40px rgba(255,80,190,.5)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;mix-blend-mode:screen}
.glitch::before{color:#39f6ff;transform:translate(-3px,0);animation:gl1 2.4s infinite steps(2)}
.glitch::after{color:#ff3fae;transform:translate(3px,0);animation:gl2 2.4s infinite steps(2)}
@keyframes gl1{0%,92%,100%{clip-path:inset(0 0 0 0);transform:translate(-3px,0)}94%{transform:translate(-8px,2px)}}
@keyframes gl2{0%,90%,100%{transform:translate(3px,0)}95%{transform:translate(9px,-2px)}}
#s1 .jp{font-size:clamp(38px,10vw,120px);position:relative;z-index:4}
#s1 .by{font-family:var(--pixel);font-size:clamp(14px,3.2vw,30px);color:#fff;margin-top:2.4vh;
  text-shadow:0 0 14px rgba(120,255,240,.9);letter-spacing:2px;position:relative;z-index:4}
#s1 .date{font-family:var(--pixel);font-size:clamp(12px,2.6vw,24px);color:#ffe0a0;margin-top:1.6vh;
  text-shadow:0 0 12px rgba(255,180,120,.9);letter-spacing:3px;position:relative;z-index:4}

/* ============ SCENE 2 — boot log CRT ============ */
#s2{background:#02030a;font-family:var(--pixel)}
#s2 .crt{position:absolute;inset:0;padding:8vh 7vw;overflow:hidden}
#s2 .scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,.28) 4px);
  mix-blend-mode:multiply;animation:flick 6s infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.7}}
#s2 .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.7))}
#boot{color:var(--term);font-size:clamp(11px,2.2vw,20px);line-height:2.1;
  text-shadow:0 0 8px rgba(90,255,140,.75)}
#boot .ln{white-space:pre-wrap;word-break:break-word}
#boot .ok{color:#b6ffce}
#boot .drive{color:#fff1a6;text-shadow:0 0 16px rgba(255,220,120,.9);font-size:clamp(13px,3vw,26px)}
.cursor{display:inline-block;width:.62em;height:1.05em;background:var(--term);vertical-align:-2px;
  box-shadow:0 0 8px rgba(90,255,140,.9);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ============ SCENE 3 — synthwave drive ============ */
#s3{background:linear-gradient(180deg,#160a2e 0%, #3a0f56 34%, #7d2170 52%, #d0466f 62%, #ff8f6e 70%, #2a0f3a 71%, #180a2c 100%);overflow:hidden}
#s3 .sky{position:absolute;left:0;right:0;top:0;height:62%}
.stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.8;animation:tw 3s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.sun{position:absolute;left:50%;top:62%;width:min(58vh,58vw);height:min(58vh,58vw);transform:translate(-50%,-50%);
  border-radius:50%;background:linear-gradient(180deg,#ffe86d 0%, #ffb24d 38%, #ff6f9d 66%, #ff4f9e 100%);
  box-shadow:0 0 90px 20px rgba(255,140,150,.55),0 0 160px 60px rgba(255,90,160,.35);
  animation:sunpulse 5s ease-in-out infinite}
@keyframes sunpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.sun .stripe{position:absolute;left:0;right:0;background:#180a2c}
/* stripes get taller toward bottom */
.sun i1{}
.mtn{position:absolute;bottom:38%;width:36%;height:20%;background:linear-gradient(180deg,#2a1147,#160a2e);
  filter:drop-shadow(0 -2px 6px rgba(180,74,237,.5))}
.mtn.l{left:0;clip-path:polygon(0 100%,0 40%,18% 60%,34% 18%,52% 55%,70% 25%,100% 70%,100% 100%)}
.mtn.r{right:0;clip-path:polygon(0 100%,0 70%,26% 30%,44% 60%,62% 20%,80% 55%,100% 42%,100% 100%)}
.mtn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(55,240,255,.5),transparent 30%);
  clip-path:inherit;mix-blend-mode:screen}
#city{position:absolute;left:50%;bottom:38%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:5px;
  height:15%;width:64%;justify-content:center;opacity:.95}
.bld{position:relative;background:#120726;border-top:1px solid rgba(55,240,255,.35);
  box-shadow:0 0 10px rgba(120,60,180,.4)}
.bld .win{position:absolute;width:2px;height:2px;background:#ffe27a;box-shadow:0 0 4px #ffcf5a;opacity:.9}
.bld .win.c{background:#7bf0ff;box-shadow:0 0 4px #37f0ff}

/* road */
.roadwrap{position:absolute;left:0;right:0;bottom:0;height:40%;perspective:340px;overflow:hidden}
.road{position:absolute;left:-25%;right:-25%;bottom:0;height:220%;transform:rotateX(74deg);transform-origin:bottom center;
  background:
   linear-gradient(180deg, rgba(20,8,40,0) 0%, #180a2c 60%),
   repeating-linear-gradient(0deg, transparent 0 38px, rgba(55,240,255,.55) 38px 40px),
   repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,45,149,.5) 60px 62px);
  background-size:100% 40px,100% 40px,120px 100%;
  animation:road 1.1s linear infinite}
@keyframes road{from{background-position:0 0,0 0,0 0}to{background-position:0 40px,0 40px,0 0}}
.reflect{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:16%;height:100%;
  background:linear-gradient(180deg, rgba(255,180,150,.55),rgba(255,90,160,.28),transparent);
  filter:blur(10px);mix-blend-mode:screen;animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.6;width:15%}50%{opacity:.9;width:19%}}
/* side streak dashes */
.streak{position:absolute;bottom:6%;width:10px;height:44px;border-radius:6px;background:linear-gradient(#ffe27a,#ff8a3c);
  box-shadow:0 0 12px #ffb14d;opacity:.9}
.streak.l{left:16%;animation:streakL 0.7s linear infinite}
.streak.r{right:16%;animation:streakR 0.7s linear infinite}
@keyframes streakL{0%{transform:translateY(-40px) scale(.4);opacity:.2}100%{transform:translateY(120px) scale(1.4);opacity:1}}
@keyframes streakR{0%{transform:translateY(-40px) scale(.4);opacity:.2}100%{transform:translateY(120px) scale(1.4);opacity:1}}

.palm{position:absolute;bottom:-1%;height:74%;filter:drop-shadow(0 0 10px rgba(0,0,0,.5));z-index:4}
.palm.l{left:-3%;transform-origin:bottom left;animation:sway 5.5s ease-in-out infinite}
.palm.r{right:-3%;transform-origin:bottom right;animation:sway 6.5s ease-in-out infinite reverse}
.palm.l2{left:8%;height:56%;opacity:.85;transform-origin:bottom left;animation:sway 7s ease-in-out infinite}
.palm.r2{right:8%;height:60%;opacity:.85;transform-origin:bottom right;animation:sway 6s ease-in-out infinite reverse}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg)}}

.car{position:absolute;left:50%;bottom:9%;width:min(46vw,340px);transform:translateX(-50%);z-index:6;
  animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.car .glow{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);width:70%;height:26px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,60,60,.7),transparent);filter:blur(6px)}

/* ============ Win95 message window ============ */
#win{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%) scale(.92);z-index:8;
  width:min(92vw,540px);opacity:0;transition:opacity .7s ease, transform .7s ease;
  font-family:var(--cjk);pointer-events:none}
#win.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.w95{background:#c8b8d0;border:2px solid #fff;border-right-color:#5a4a66;border-bottom-color:#5a4a66;
  box-shadow:3px 3px 0 rgba(0,0,0,.45), 0 0 40px rgba(255,90,190,.35);padding:3px}
.w95 .bar{display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,#8a2ea8,#d84fbf);color:#fff;padding:5px 6px;
  font-family:var(--pixel);font-size:11px;letter-spacing:1px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.w95 .bar .btns{display:flex;gap:3px}
.w95 .bar .b{width:16px;height:14px;background:#c8b8d0;border:1px solid #fff;border-right-color:#5a4a66;
  border-bottom-color:#5a4a66;color:#2a1030;font-size:10px;line-height:12px;text-align:center;font-family:var(--pixel)}
.w95 .body{background:#0e0720;border:2px solid #5a4a66;border-right-color:#fff;border-bottom-color:#fff;
  margin-top:3px;padding:16px 16px 14px}
#msg{color:var(--gold);font-size:clamp(13px,2.5vw,16px);line-height:1.9;letter-spacing:.3px;
  height:min(40vh,300px);overflow-y:auto;text-shadow:0 0 10px rgba(240,196,99,.35);
  white-space:pre-wrap;scrollbar-width:thin;scrollbar-color:#8a2ea8 #0e0720}
#msg::-webkit-scrollbar{width:8px}#msg::-webkit-scrollbar-track{background:#160a2c}
#msg::-webkit-scrollbar-thumb{background:#8a2ea8;border:1px solid #d84fbf}
#msg .heart{color:#ff5fa8;text-shadow:0 0 12px rgba(255,95,168,.8)}
#msg .quote{color:var(--gold-soft)}
.tcur{display:inline-block;width:.5em;height:1.05em;background:var(--gold);vertical-align:-2px;
  box-shadow:0 0 8px rgba(240,196,99,.8);animation:blink 1s steps(1) infinite;margin-left:1px}
.w95 .status{margin-top:3px;background:#c8b8d0;border:1px solid #5a4a66;padding:3px 8px;
  font-family:var(--pixel);font-size:9px;color:#3a1a48;display:flex;justify-content:space-between}
.skiphint{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--pixel);font-size:8px;color:rgba(255,255,255,.6);opacity:0;animation:fadein 1s 2s forwards}
@keyframes fadein{to{opacity:1}}

/* sound + mute controls */
#soundHint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;
  font-family:var(--pixel);font-size:10px;color:#fff;background:rgba(30,8,40,.7);
  border:1px solid var(--magenta);padding:9px 14px;border-radius:4px;cursor:pointer;display:none;
  box-shadow:0 0 18px rgba(255,45,149,.5);animation:pulseHint 1.6s infinite}
@keyframes pulseHint{50%{box-shadow:0 0 28px rgba(255,45,149,.9)}}
#mute{position:fixed;right:14px;top:14px;z-index:30;width:36px;height:36px;border-radius:50%;
  background:rgba(20,8,40,.6);border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;
  font-size:15px;display:none;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(55,240,255,.5)}
#mute.show{display:flex}
</style>
</head>
<body>
<audio id="bgm" loop preload="auto">
  <source src="assets/oriental.mp3" type="audio/mpeg" />
</audio>

<!-- ================= SCENE 1 ================= -->
<section id="s1" class="scene">
  <div class="panels"></div>
  <div class="sheen"></div>
  <div class="bokeh" style="width:120px;height:120px;left:8%;top:10%;background:#ffe27a"></div>
  <div class="bokeh" style="width:80px;height:80px;left:22%;top:20%;background:#7bf0ff;animation-delay:1s"></div>
  <div class="bokeh" style="width:60px;height:60px;left:14%;top:34%;background:#ff8ad8;animation-delay:.5s"></div>
  <div class="bokeh" style="width:100px;height:100px;right:26%;top:8%;background:#a6ffea;animation-delay:1.4s"></div>
  <div class="bokeh" style="width:70px;height:70px;right:12%;bottom:18%;background:#ffd27a;animation-delay:.8s"></div>

  <!-- classical bust (Greek statue silhouette) -->
  <svg class="bust" viewBox="0 0 240 320" aria-hidden="true">
    <!-- neck + shoulders -->
    <path d="M96 252c2-30 8-46 6-66h36c-2 20 4 36 6 66z" fill="#e7d8f0" opacity="0.85"/>
    <!-- hair mass -->
    <path d="M120 66c-46 0-74 30-74 76 0 18 6 32 13 42 1-26 5-42 10-54-5 30-1 50 6 62-3-42 9-72 45-72s36 30 33 72c7-12 11-32 6-62 5 12 9 28 10 54 7-10 13-24 13-42 0-46-28-76-74-76z" fill="#efe2f7"/>
    <!-- face -->
    <ellipse cx="120" cy="154" rx="50" ry="64" fill="#f4ecfa"/>
    <!-- hair curls -->
    <g fill="#e2cef2" opacity="0.9">
      <circle cx="74" cy="118" r="9"/><circle cx="67" cy="150" r="8"/><circle cx="82" cy="94" r="9"/>
      <circle cx="120" cy="80" r="10"/><circle cx="158" cy="94" r="9"/><circle cx="173" cy="122" r="9"/><circle cx="176" cy="152" r="8"/>
    </g>
    <!-- brows + eyes (blank, neutral) -->
    <g fill="#cbb2e2" opacity="0.55">
      <ellipse cx="101" cy="152" rx="10" ry="5"/><ellipse cx="139" cy="152" rx="10" ry="5"/>
    </g>
    <!-- nose -->
    <path d="M120 150l-7 28h14z" fill="#e0cdf0" opacity="0.5"/>
    <!-- neutral lips -->
    <path d="M107 198h26" stroke="#cbb2e2" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </svg>

  <!-- palm -->
  <svg class="palm1" viewBox="0 0 200 400" aria-hidden="true">
    <path d="M96 400c2-120 6-210 8-256" stroke="#0c0518" stroke-width="12" fill="none"/>
    <g fill="#0c0518">
      <path d="M104 150c-34-30-78-34-104-22 30-4 66 6 96 30z"/>
      <path d="M104 150c30-34 74-46 104-40-30 2-66 18-92 48z"/>
      <path d="M104 148c-14-42-46-72-78-84 26 22 48 54 64 92z"/>
      <path d="M104 148c16-40 52-66 86-74-28 18-54 46-72 84z"/>
      <path d="M104 152c-40-8-80 6-104 30 30-16 68-24 100-16z"/>
      <path d="M104 152c34-14 78-10 104 10-30-10-70-10-100 4z"/>
    </g>
  </svg>

  <div class="band"></div>
  <div class="titlewrap">
    <div class="jp glitch" data-t="旅の始まり">旅の始まり</div>
    <div class="by">by Sissi</div>
    <div class="date">07.31.2026</div>
  </div>
</section>

<!-- ================= SCENE 2 ================= -->
<section id="s2" class="scene">
  <div class="crt">
    <div id="boot"></div>
  </div>
  <div class="scan"></div>
  <div class="vign"></div>
</section>

<!-- ================= SCENE 3 ================= -->
<section id="s3" class="scene">
  <div class="sky">
    <div class="stars" id="stars"></div>
  </div>
  <div class="sun" id="sun"></div>
  <div class="mtn l"></div>
  <div class="mtn r"></div>
  <div id="city"></div>

  <div class="roadwrap">
    <div class="road"></div>
    <div class="reflect"></div>
  </div>
  <div class="streak l"></div>
  <div class="streak r"></div>

  <!-- palms framing -->
  <svg class="palm l" viewBox="0 0 200 400" aria-hidden="true"><use href="#palmshape"/></svg>
  <svg class="palm r" viewBox="0 0 200 400" style="transform:scaleX(-1)" aria-hidden="true"><use href="#palmshape"/></svg>
  <svg class="palm l2" viewBox="0 0 200 400" aria-hidden="true"><use href="#palmshape"/></svg>
  <svg class="palm r2" viewBox="0 0 200 400" style="transform:scaleX(-1)" aria-hidden="true"><use href="#palmshape"/></svg>

  <!-- shared palm shape -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="palmshape">
      <path d="M96 400c2-120 6-210 8-256" stroke="#090312" stroke-width="12" fill="none"/>
      <g fill="#090312">
        <path d="M104 150c-34-30-78-34-104-22 30-4 66 6 96 30z"/>
        <path d="M104 150c30-34 74-46 104-40-30 2-66 18-92 48z"/>
        <path d="M104 148c-14-42-46-72-78-84 26 22 48 54 64 92z"/>
        <path d="M104 148c16-40 52-66 86-74-28 18-54 46-72 84z"/>
        <path d="M104 152c-40-8-80 6-104 30 30-16 68-24 100-16z"/>
        <path d="M104 152c34-14 78-10 104 10-30-10-70-10-100 4z"/>
      </g>
    </g>
  </defs></svg>

  <!-- car (rear view) -->
  <svg class="car" viewBox="0 0 320 180" aria-hidden="true">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a1740"/><stop offset="1" stop-color="#0d0620"/>
      </linearGradient>
      <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ff2b4d"/><stop offset="1" stop-color="#ff6a2b"/>
      </linearGradient>
    </defs>
    <!-- ground shadow -->
    <ellipse cx="160" cy="168" rx="120" ry="12" fill="#000" opacity="0.5"/>
    <!-- roof / rear window -->
    <path d="M96 66c8-22 24-30 64-30s56 8 64 30l-6 10H102z" fill="#160a2c"/>
    <rect x="110" y="48" width="100" height="26" rx="6" fill="#3a2358" opacity="0.9"/>
    <path d="M118 52h84l-6 18h-72z" fill="#5b3f7a" opacity="0.5"/>
    <!-- main body -->
    <path d="M60 78h200c14 0 22 8 24 22l6 34c2 12-4 20-18 20H48c-14 0-20-8-18-20l6-34c2-14 10-22 24-22z" fill="url(#body)"/>
    <!-- side edge neon -->
    <path d="M40 120h240" stroke="#b14aed" stroke-width="2" opacity="0.5"/>
    <!-- taillights -->
    <rect x="52" y="104" width="70" height="16" rx="8" fill="url(#tail)"/>
    <rect x="198" y="104" width="70" height="16" rx="8" fill="url(#tail)"/>
    <!-- center strip -->
    <rect x="128" y="108" width="64" height="8" rx="4" fill="#ff3a5a" opacity="0.9"/>
    <!-- glow blooms -->
    <rect x="46" y="100" width="82" height="24" rx="12" fill="#ff3355" opacity="0.35"/>
    <rect x="192" y="100" width="82" height="24" rx="12" fill="#ff3355" opacity="0.35"/>
    <!-- license plate -->
    <rect x="132" y="132" width="56" height="20" rx="3" fill="#f4f0d8" stroke="#111"/>
    <text x="160" y="147" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="10" fill="#1a1a1a" letter-spacing="0.5">RW0731</text>
    <!-- bumper -->
    <path d="M40 150h240" stroke="#1a1030" stroke-width="8" stroke-linecap="round"/>
  </svg>

  <!-- Win95 message window -->
  <div id="win">
    <div class="w95">
      <div class="bar">
        <span>&#128156; to_ryan.txt</span>
        <span class="btns"><span class="b">_</span><span class="b">▢</span><span class="b">×</span></span>
      </div>
      <div class="body">
        <div id="msg"></div>
      </div>
      <div class="status"><span>C:\LOVE\RYAN</span><span id="wstat">TYPING…</span></div>
    </div>
    <div class="skiphint">CLICK 跳过打字 · CLICK TO SKIP</div>
  </div>
</section>

<!-- controls -->
<div id="soundHint">🔊 点一下开启音乐 · TAP FOR SOUND</div>
<button id="mute" aria-label="mute">🔊</button>

<script>
(function(){
  "use strict";
  var $ = function(s){return document.querySelector(s);};
  var bgm = $("#bgm");
  var soundHint = $("#soundHint");
  var muteBtn = $("#mute");

  /* ---------- audio autoplay + gesture fallback ---------- */
  var audioStarted = false;
  function startAudio(){
    if(audioStarted) return;
    bgm.volume = 0.0;
    var p = bgm.play();
    if(p && p.then){
      p.then(function(){
        audioStarted = true;
        soundHint.style.display = "none";
        muteBtn.classList.add("show");
        fadeVol(0.75, 1600);
      }).catch(function(){
        soundHint.style.display = "block";
      });
    }
  }
  function fadeVol(target, ms){
    var start = bgm.volume, t0 = performance.now();
    (function step(now){
      var k = Math.min(1,(now-t0)/ms);
      bgm.volume = start + (target-start)*k;
      if(k<1) requestAnimationFrame(step);
    })(performance.now());
  }
  ["pointerdown","keydown","touchstart"].forEach(function(ev){
    window.addEventListener(ev, function once(){
      startAudio();
    }, {once:false});
  });
  soundHint.addEventListener("click", startAudio);
  var muted = false;
  muteBtn.addEventListener("click", function(e){
    e.stopPropagation();
    muted = !muted; bgm.muted = muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  /* ---------- scene helpers ---------- */
  function show(id){ $(id).classList.add("on"); }
  function hide(id){ $(id).classList.remove("on"); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  /* ---------- build starfield ---------- */
  (function(){
    var wrap = $("#stars"), n = 70, html = "";
    for(var i=0;i<n;i++){
      var x=Math.random()*100, y=Math.random()*70, d=(Math.random()*3).toFixed(2), s=(Math.random()*1.6+0.6).toFixed(1);
      html += '<span class="star" style="left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;animation-delay:'+d+'s"></span>';
    }
    wrap.innerHTML = html;
  })();

  /* ---------- sun stripes ---------- */
  (function(){
    var sun = $("#sun"), html="";
    // horizontal bands over lower half, getting taller downward
    var tops=[54,60,66,73,81,90];
    var hs=[3,4,5,6,8,10];
    for(var i=0;i<tops.length;i++){
      html += '<div class="stripe" style="top:'+tops[i]+'%;height:'+hs[i]+'%"></div>';
    }
    sun.innerHTML = html;
  })();

  /* ---------- city skyline ---------- */
  (function(){
    var city = $("#city"), html="", n=22;
    for(var i=0;i<n;i++){
      var h = 30 + Math.random()*70;          // % of city height
      var w = 10 + Math.random()*16;          // px
      var wins = "";
      var rows = Math.floor(h/12), cols = Math.max(1,Math.floor(w/6));
      for(var r=0;r<rows;r++){
        for(var c=0;c<cols;c++){
          if(Math.random()>0.45){
            var cls = Math.random()>0.6 ? "win c":"win";
            var wx = 2 + c*5, wy = 3 + r*6;
            wins += '<span class="'+cls+'" style="left:'+wx+'px;bottom:'+wy+'px"></span>';
          }
        }
      }
      html += '<div class="bld" style="height:'+h+'%;width:'+w+'px">'+wins+'</div>';
    }
    city.innerHTML = html;
  })();

  /* ---------- boot log typing ---------- */
  var bootLines = [
    {t:"Sissi-made  v07.31   (c) 2026", cls:""},
    {t:"", cls:""},
    {t:"> LOADING MEMORIES ............ ", ok:"OK"},
    {t:"> DESTINATION/LOS ANGELES ......... ", ok:"OK"},
    {t:"> ROUTE: BOSTON -> CALIFORNIA . ", ok:"OK"},
    {t:"> AUDIO: MP3 ............. ", ok:"READY"},
    {t:"> PASSENGER: RYAN ............. ", ok:"READY"},
    {t:"", cls:""},
    {t:"▶ LET'S DRIVE ◀", cls:"drive"}
  ];
  function typeText(el, str, speed){
    return new Promise(function(res){
      var i=0;
      (function tick(){
        if(i<=str.length){
          el.textContent = str.slice(0,i);
          i++;
          setTimeout(tick, speed);
        } else res();
      })();
    });
  }
  async function runBoot(){
    var box = $("#boot");
    box.innerHTML = "";
    for(var i=0;i<bootLines.length;i++){
      var L = bootLines[i];
      var line = document.createElement("div");
      line.className = "ln " + (L.cls||"");
      box.appendChild(line);
      if(L.t===""){ line.innerHTML="&nbsp;"; await sleep(120); continue; }
      var span = document.createElement("span");
      line.appendChild(span);
      var cur = document.createElement("span"); cur.className="cursor"; line.appendChild(cur);
      await typeText(span, L.t, L.cls==="drive"?46:16);
      if(L.ok){
        var ok=document.createElement("span"); ok.className="ok"; line.appendChild(ok);
        line.removeChild(cur);
        await typeText(ok, L.ok, 40);
      } else {
        line.removeChild(cur);
      }
      await sleep(L.cls==="drive"?100:90);
    }
    // trailing blink on drive line
    var d = box.querySelector(".drive");
    if(d){ var c=document.createElement("span"); c.className="cursor"; c.style.background="#fff1a6"; d.appendChild(c); }
  }

  /* ---------- birthday message ---------- */
  var msgParts = [
    {t:"Ryan，生日快乐"},
    {t:""},
    {t:"你写的那篇随笔，我看了很久。", q:"“此山非众人之山，乃吾之山也。昔日所望，今已身至其中。”"},
    {t:""},
    {t:"看到这句话的时候，我忽然觉得，好像真的陪你走过了这一段路。"},
    {t:""},
    {t:"这些年，别人看到的可能只是结果，但我知道，那些熬夜加班的时候，那些不断学习、反思、不断和自己较劲的日子，才是真正让你走在属于自己的那座山上。"},
    {t:""},
    {t:"我相信未来的某一天，你坐在私募办公室里，研究喜欢的公司，和优秀的伙伴讨论投资，做着真正热爱的事情。"},
    {t:""},
    {t:"很多年以后，你再回头看今天，会发现那些曾经觉得遥远的目标，都已经变成了生活的一部分。"},
    {t:""},
    {t:"也许那时候，我们已经搬到了另一个城市；也许已经有了属于自己的家；周末一起去健身，晚上再一起计划下一趟旅行。偶尔聊起今天，笑着说：", q:"“原来那时候，我们还住在波士顿的红砖小公寓。”"},
    {t:""},
    {t:"曾经觉得很远的未来，到那时候，大概都已经变成了我们的日常。"},
    {t:""},
    {t:"谢谢你一直认真地生活，也谢谢你让我参与这段旅程。"},
    {t:""},
    {t:"愿你始终忠于自己，享受登山的过程和山顶的绝美风景，山于心中，虽远必达。"},
    {t:""},
    {t:"生日快乐。", heart:"❤️"}
  ];

  var skipMsg = false;
  async function typeInto(el, str, speed, cls){
    var node = document.createElement("span");
    if(cls) node.className = cls;
    el.appendChild(node);
    for(var i=0;i<str.length;i++){
      if(skipMsg){ node.textContent = str; break; }
      node.textContent += str[i];
      el.parentNode.scrollTop = el.parentNode.scrollHeight;
      await sleep(speed);
    }
  }
  async function runMessage(){
    var box = $("#msg");
    box.innerHTML = "";
    var cur = document.createElement("span"); cur.className="tcur";
    for(var i=0;i<msgParts.length;i++){
      var P = msgParts[i];
      var p = document.createElement("div");
      box.appendChild(p);
      if(P.t==="" && !P.q && !P.heart){ p.innerHTML="&nbsp;"; if(!skipMsg) await sleep(140); continue; }
      if(P.t) await typeInto(p, P.t, 42);
      if(P.q) await typeInto(p, P.q, 44, "quote");
      if(P.heart) await typeInto(p, P.heart, 60, "heart");
      box.scrollTop = box.scrollHeight;
      if(!skipMsg) await sleep(220);
    }
    $("#wstat").textContent = "DONE ♥";
  }

  /* ---------- master flow ---------- */
  async function flow(){
    // Scene 1
    show("#s1");
    startAudio();
    await sleep(2600);
    // Scene 2
    hide("#s1");
    show("#s2");
    await sleep(700);
    await runBoot();
    await sleep(1300);
    // Scene 3 — let the drive play solo for a beat before the letter
    hide("#s2");
    show("#s3");
    await sleep(4500);
    $("#win").classList.add("show");
    // allow click-to-skip during message
    var skipHandler = function(){ skipMsg = true; };
    $("#win").addEventListener("click", skipHandler);
    await sleep(500);
    await runMessage();
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded", flow);
  } else { flow(); }
})();
</script>
</body>
</html>
